[package]
name = "idevice-desktop"
version = "0.0.4"
description = "Desktop UI for jkcoxson/idevice"
authors = ["idevice_desktop contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "idevice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
plist = "1.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mdns-sd = "0.19"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
libc = "0.2"
# reqwest 0.13 names its rustls backend `rustls`, not `rustls-tls`. The project
# builds every TLS path on rustls, so no native-tls backend is enabled.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
sha1 = "0.10"
sha2 = "0.10"
rootcause = "0.12"
zeroize = "1"

[dependencies.isideload]
git = "https://github.com/nab138/isideload.git"
rev = "0bee45d8cdb07ca24524a26f38fdda0dbb4e04b3"
default-features = false
features = ["install", "keyring-storage", "tokio-mt"]

[dependencies.idevice]
git = "https://github.com/jkcoxson/idevice.git"
rev = "8eed181f39a16ea70380ec8c3cff6bed07a1ef69"
default-features = false
features = [
  "ring",
  "tcp",
  "usbmuxd",
  "pair",
  "afc",
  "diagnostics_relay",
  "installation_proxy",
  "house_arrest",
  "crashreportcopymobile",
  "springboardservices",
  "syslog_relay",
  "screenshotr",
  "amfi",
  "mobile_image_mounter",
  "location_simulation",
  "core_device",
  "core_device_proxy",
  "tunnel_tcp_stack",
  "rsd",
  "dvt",
  "device_info",
  "sysmontap",
  "pcapd",
  "misagent",
  "notification_proxy",
  "mobilebackup2",
  "debug_proxy",
  "tss",
  "remote_pairing"
]
